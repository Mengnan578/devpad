name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python version
        run: python --version

      # --- platform-independent checks -------------------------------------
      - name: Static checks
        run: python tests/check_static.py

      - name: Driver contract (no windows opened)
        run: python tests/test_terminals.py

      # --- POSIX-only suites ----------------------------------------------
      # The end-to-end suite spawns `/bin/sh` services and uses POSIX process
      # groups; it is the strongest signal on macOS and meaningless on Windows.
      - name: End-to-end lifecycle (POSIX)
        if: runner.os != 'Windows'
        run: python tests/test_devpad.py

      # --- Windows-specific checks ----------------------------------------
      # These exercise the parts that cannot be covered by mocked values: real
      # netstat output, real process trees, real PATHEXT resolution. They cannot
      # verify that a terminal window appears — hosted runners have no desktop.
      - name: Windows platform suite
        if: runner.os == 'Windows'
        run: python tests/test_windows.py

      - name: Doctor runs on a generated config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "dp"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          @"
          version: 1
          name: ci
          services:
            demo:
              kind: proc
              dir: .
              command: echo hi
              ready: { timeout: 5 }
          "@ | Set-Content -Path (Join-Path $tmp "devpad.yaml") -Encoding UTF8
          python scripts/devpad.py -C $tmp doctor
          python scripts/devpad.py -C $tmp config
